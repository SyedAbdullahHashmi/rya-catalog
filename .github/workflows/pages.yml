name: Build & Deploy Catalogs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build catalogs
        run: python build_catalogs.py

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy
          cp index.html catalog_form.html deploy/
          cp -r html_catalogs deploy/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: main
          keep_files: true
          commit_message: "Deploy catalogs [skip ci]"
