<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RYRA &amp; CO. — Product Catalogs</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #2f2115;
            background: #edd3a8;
            padding: 0;
            line-height: 1.5;
        }
        .page { max-width: 780px; margin: 0 auto; padding: 44px 32px 48px; }
        h1 { font-size: 1.75rem; margin-bottom: 4px; }
        .sub { font-size: 0.88rem; color: #604622; margin-bottom: 32px; }

        .brand-section {
            background: #fdf2de;
            border: 1px solid #c9b896;
            border-radius: 10px;
            padding: 24px 24px 20px;
            margin-bottom: 18px;
        }
        .brand-section:last-child { margin-bottom: 0; }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1.5px solid #d5ac55;
        }
        .brand-mark {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border: 2px solid #d5ac55;
            border-radius: 50%;
            flex-shrink: 0;
            position: relative;
        }
        .brand-mark::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 14px;
            height: 14px;
            background: #d5ac55;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        .brand-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #2f2115;
        }
        .brand-sub {
            font-size: 0.78rem;
            color: #604622;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .catalog-links { display: flex; flex-wrap: wrap; gap: 10px 18px; }
        .catalog-links a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            border: 1px solid #c9b896;
            border-radius: 6px;
            padding: 9px 15px;
            color: #2f2115;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            transition: background 0.15s, border-color 0.15s;
        }
        .catalog-links a:hover {
            background: #f5ecd9;
            border-color: #b8a07a;
        }
        .catalog-links .link-icon {
            width: 16px;
            height: 16px;
            border: 1.5px solid #c9b896;
            border-radius: 50%;
            flex-shrink: 0;
            position: relative;
        }
        .catalog-links .link-icon::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: #c9b896;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        .catalog-links .link-label {
            text-transform: capitalize;
        }

        .section-note {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #d5ac55;
            font-size: 0.76rem;
            color: #8a6e4e;
            text-align: center;
        }

        @media (max-width: 600px) {
            .page { padding: 28px 18px 36px; }
            .brand-section { padding: 18px 16px 16px; }
            .brand-row { gap: 10px; }
            .brand-mark { width: 36px; height: 36px; }
            .brand-mark::after { width: 10px; height: 10px; }
            .catalog-links a { padding: 7px 12px; font-size: 0.82rem; }
        }
    </style>
</head>
<body>
    <div class="page">
        <h1>Product Catalogs</h1>
        <p class="sub">Browse and share our collections.</p>

        <div class="brand-section">
            <div class="brand-row">
                <div class="brand-mark"></div>
                <div>
                    <div class="brand-title">RSTREET</div>
                    <div class="brand-sub">Men's Collections</div>
                </div>
            </div>
            <div class="catalog-links">
                <a href="html_catalogs/catalog_mens_jewelry.html">
                    <span class="link-icon"></span>
                    <span class="link-label">Men's Jewelry &amp; Accessories</span>
                </a>
            </div>
            <div class="section-note">Watches, wallets, necklaces, sunglasses, bracelets, rings &amp; more.</div>
        </div>

        <div class="brand-section">
            <div class="brand-row">
                <div class="brand-mark"></div>
                <div>
                    <div class="brand-title">RYRA &amp; CO.</div>
                    <div class="brand-sub">Women's Collections</div>
                </div>
            </div>
            <div class="catalog-links">
                <a href="html_catalogs/catalog_womens_jewelry.html">
                    <span class="link-icon"></span>
                    <span class="link-label">Women's Jewelry &amp; Accessories</span>
                </a>
                <a href="html_catalogs/catalog_womens_clutches.html">
                    <span class="link-icon"></span>
                    <span class="link-label">Women's Clutches</span>
                </a>
            </div>
            <div class="section-note">Earrings, necklaces, bracelets, rings &amp; more.</div>
        </div>
    </div>
</body>
</html>
